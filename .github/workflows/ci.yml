name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 全量构建 + 测试；跨库用例(Testcontainers)在 runner 上无 Docker 时按设计 skip，不阻塞
      - name: Build & Test
        run: chmod +x ./gradlew && ./gradlew build --no-daemon
