name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 全量构建 + 测试；跨库用例(Testcontainers)默认跳过(需 Docker、易抖动)，
      # 由 -PskipCrossDb 控制；真库兼容性作为可选深度验证单独跑。
      - name: Build & Test
        run: chmod +x ./gradlew && ./gradlew build --no-daemon -PskipCrossDb=true
