name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # nightly：每日 UTC 02:00（北京时间 10:00）跑真库跨库套件
  schedule:
    - cron: '0 2 * * *'
  # 允许手动触发 —— 例如刚改完迁移脚本，想立刻验一次真库
  workflow_dispatch:

jobs:
  # ---------- 主门禁：快 ----------
  # 跨库用例（Testcontainers）默认跳过 —— 拉镜像慢、环境易抖动，不该阻塞每一次 push。
  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 全量构建 + 测试；跨库用例(Testcontainers)默认跳过(需 Docker、易抖动)，
      # 由 -PskipCrossDb 控制；真库兼容性交给下面的 cross-db job（nightly）。
      - name: Build & Test
        run: chmod +x ./gradlew && ./gradlew build --no-daemon -PskipCrossDb=true

      # 失败时把具体失败用例名+报错写进 Job Summary(公开 run 页面直接可见，便于定位)
      - name: Test failure report
        if: failure()
        run: |
          echo "## ❌ 失败的测试用例" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rl "<failure" workflow-tests/build/test-results/test/ 2>/dev/null | while read -r f; do
            grep -E "<testcase|<failure|expected:|but was:|Caused by" "$f" | head -60
          done >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(未解析到失败用例，见 Build & Test 日志)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------- 真库深度验证：nightly ----------
  # JPA×MySQL / JPA×PostgreSQL / MyBatis×MySQL / MyBatis×PostgreSQL 四种组合。
  # 这套用例的全部价值就在「真库」两个字上：如果它只在某人的机器上手动跑过几次，
  # 那就是一份会过期的绿 —— 而且是慢慢过期的，没人会注意到它在哪次改动后失效。
  # 放进 nightly 才叫持续保障（想立刻验一次就手动触发 workflow_dispatch）。
  cross-db:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 不加 -PskipCrossDb，跨库用例纳入运行
      - name: Build & Test (cross-DB included)
        run: chmod +x ./gradlew && ./gradlew build --no-daemon

      # 绿不够，得知道到底跑了几条 —— 否则「跨库全绿」可能只是 0 条用例在跑
      - name: Cross-DB summary
        if: always()
        run: |
          DIR=workflow-tests/build/test-results/test
          {
            echo "## 🐳 跨库套件（真库）"
            echo ""
            for K in tests skipped failures; do
              V=$(grep -ho "$K=\"[0-9]*\"" $DIR/TEST-com.workflow.tests.crossdb.*.xml 2>/dev/null \
                  | grep -o '[0-9]*$' | paste -sd+ - | bc)
              echo "- $K: ${V:-0}"
            done
            echo ""
            echo "> push/PR 门禁用 \`-PskipCrossDb=true\` 跳过这套；它只在 nightly 与手动触发时运行。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test failure report
        if: failure()
        run: |
          echo "## ❌ 失败的测试用例（cross-DB）" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -rl "<failure" workflow-tests/build/test-results/test/ 2>/dev/null | while read -r f; do
            grep -E "<testcase|<failure|expected:|but was:|Caused by" "$f" | head -60
          done >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(未解析到失败用例，见 Build & Test 日志)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
